name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: python -m ruff check agents_on_hand/ tests/

      - name: Ruff format check
        run: python -m ruff format --check agents_on_hand/ tests/

      - name: Mypy
        run: python -m mypy agents_on_hand

      - name: Run tests with coverage
        env:
          AOH_DEV_ALLOW_ALL_USERS: "1"
        run: python -m pytest tests/ -v --cov=agents_on_hand --cov-report=term-missing --cov-fail-under=80
